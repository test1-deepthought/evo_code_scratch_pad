name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}
      - name: Debug Python env
        run: |
          python3 --version
          python3 -c "import tempfile; print('tempdir:', tempfile.gettempdir())"
          python3 -c "import os; print('/tmp writable:', os.access('/tmp', os.W_OK))"
