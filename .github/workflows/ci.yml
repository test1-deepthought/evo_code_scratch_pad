name: CI - Lean4 Theorem Generator

on:
  push:
    branches:
      - 'evo/lean4-theorem-generator*'
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pipeline code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check Python files exist
        run: |
          for f in configs/lora_config.py scripts/prepare_dataset.py scripts/train.py scripts/generate.py; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -l < "$f") lines)"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Validate Python syntax
        shell: python
        run: |
          import ast, sys
          scripts = [
            'configs/lora_config.py',
            'scripts/prepare_dataset.py',
            'scripts/train.py',
            'scripts/generate.py',
          ]
          errors = []
          for s in scripts:
            try:
              with open(s) as f:
                ast.parse(f.read(), filename=s)
              print(f'OK: {s}')
            except SyntaxError as e:
              errors.append(f'SYNTAX_ERROR in {s}: {e}')
              print(f'FAIL: {s}: {e}')
          if errors:
            sys.exit(1)

      - name: Validate sample_prompts.jsonl
        shell: python
        run: |
          import json
          with open('sample_prompts.jsonl') as f:
              for i, line in enumerate(f, 1):
                  line = line.strip()
                  if not line:
                      continue
                  obj = json.loads(line)
                  assert 'prompt' in obj and 'difficulty' in obj, f'Line {i}: missing fields'
                  assert obj['difficulty'] in ('easy', 'medium', 'hard'), f'Line {i}: bad difficulty'
          print(f'sample_prompts.jsonl: valid ({i} entries)')

      - name: Run test suite (if tests/ present)
        shell: bash
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --tb=short 2>&1 || python tests/run_all.py
          else
            echo "tests/ directory not found - skipping unit tests"
          fi

      - name: Summary
        run: |
          echo '========================================'
          echo 'CI checks complete'
          echo '========================================'
