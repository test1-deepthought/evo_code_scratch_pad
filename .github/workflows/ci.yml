name: CI — Lean4 Theorem Generator

on:
  push:
    branches:
      - 'evo/lean4-theorem-generator*'
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pipeline code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest  # lightweight — no torch needed for tests

      - name: Run syntax validation
        run: |
          python -c "
import ast, sys
scripts = [
    'configs/lora_config.py',
    'scripts/prepare_dataset.py',
    'scripts/train.py',
    'scripts/generate.py',
]
errors = []
for s in scripts:
    try:
        with open(s) as f:
            ast.parse(f.read(), filename=s)
        print(f'  OK: {s}')
    except SyntaxError as e:
        errors.append(f'SYNTAX ERROR in {s}: {e}')
        print(f'  FAIL: {s}: {e}')
if errors:
    sys.exit(1)
"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 || \
          python tests/run_all.py

      - name: Validate sample_prompts.jsonl
        run: |
          python -c "
import json
with open('sample_prompts.jsonl') as f:
    for i, line in enumerate(f, 1):
        line = line.strip()
        if not line:
            continue
        obj = json.loads(line)
        assert 'prompt' in obj and 'difficulty' in obj, f'Line {i}: missing fields'
        assert obj['difficulty'] in ('easy', 'medium', 'hard'), f'Line {i}: bad difficulty'
print('sample_prompts.jsonl: valid')
"

      - name: Check setup.sh is executable
        run: |
          test -x scripts/setup.sh && echo 'setup.sh is executable' || (
            chmod +x scripts/setup.sh && echo 'setup.sh made executable'
          )

      - name: Summary
        run: |
          echo '✅ All CI checks passed for Lean4 Theorem Generator pipeline'
          echo "Files:"
          find . -name '*.py' -not -path './.venv/*' | sort
          wc -l configs/lora_config.py scripts/*.py
