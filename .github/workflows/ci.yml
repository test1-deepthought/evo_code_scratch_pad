name: CI

on:
  workflow_dispatch:
    inputs:
      test_command:
        description: 'Test command to run'
        required: true
        default: 'python3 -m pytest'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run test
        run: ${{ github.event.inputs.test_command }}
