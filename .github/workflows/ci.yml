name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}

      - name: Python
        if: hashFiles('**/*.py') != ''
        run: |
          for f in $(find . -name '*.py' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && python3 "$f" || exit 1
          done

      - name: Shell
        if: hashFiles('**/*.sh') != ''
        run: |
          for f in $(find . -name '*.sh' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && bash "$f" || exit 1
          done


      - name: PowerShell
        if: hashFiles('**/*.ps1') != ''
        run: |
          for f in $(find . -name '*.ps1' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && pwsh -File "$f" || exit 1
          done

      - name: Node.js
        if: hashFiles('**/package.json') != ''
        run: |
          node --version
          npm install && npm test

      - name: TypeScript
        if: hashFiles('**/*.ts', '**/tsconfig.json') != ''
        run: |
          npm install -g typescript
          for f in $(find . -name '*.ts' -not -path './.github/*' -not -path '*/node_modules/*' 2>/dev/null); do
            echo "=== $f ===" && tsc --noEmit "$f" || true
          done

      - name: Rust
        if: hashFiles('**/Cargo.toml') != ''
        run: |
          rustc --version
          cargo test

      - name: Go
        if: hashFiles('**/*.go') != ''
        run: |
          go version
          for f in $(find . -name '*_test.go' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && go test "$(dirname "$f")/..." || exit 1
          done
          if ! find . -name '*_test.go' -not -path './.github/*' 2>/dev/null | grep -q .; then
            for f in $(find . -name '*.go' -not -path './.github/*' -not -name '*_test.go' 2>/dev/null); do
              echo "=== $f ===" && go build -o /dev/null "$f" || exit 1
            done
          fi

      - name: Java
        if: hashFiles('**/*.java') != ''
        run: |
          java --version
          for f in $(find . -name '*.java' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && javac "$f" || exit 1
          done

      - name: C
        if: hashFiles('**/*.c') != ''
        run: |
          for f in $(find . -name '*.c' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && gcc -Wall -Werror -o /tmp/a.out "$f" && /tmp/a.out && rm /tmp/a.out || exit 1
          done

      - name: C++
        if: hashFiles('**/*.cpp', '**/*.cc', '**/*.cxx') != ''
        run: |
          for f in $(find . -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && g++ -Wall -Werror -o /tmp/a.out "$f" && /tmp/a.out && rm /tmp/a.out || exit 1
          done

      - name: Make
        if: hashFiles('**/Makefile') != ''
        run: make

      - name: CMake
        if: hashFiles('**/CMakeLists.txt') != ''
        run: |
          mkdir -p build && cd build && cmake .. && make

      - name: Ruby
        if: hashFiles('**/*.rb') != ''
        run: |
          for f in $(find . -name '*.rb' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && ruby "$f" || exit 1
          done

      - name: PHP
        if: hashFiles('**/*.php') != ''
        run: |
          for f in $(find . -name '*.php' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && php -l "$f" && php "$f" || exit 1
          done

      - name: C# (.NET)
        if: hashFiles('**/*.cs', '**/*.csproj', '**/*.sln') != ''
        run: |
          dotnet --version || true
          for f in $(find . -name '*.cs' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && dotnet-script "$f" || true
          done
          for proj in $(find . -name '*.csproj' -o -name '*.sln' -not -path './.github/*' 2>/dev/null); do
            dotnet build "$proj" && dotnet test "$(dirname "$proj")" || true
          done

      - name: Zig
        if: hashFiles('**/*.zig') != ''
        run: |
          sudo snap install zig --classic 2>/dev/null || true
          for f in $(find . -name '*.zig' -not -path './.github/*' 2>/dev/null); do
            echo "=== $f ===" && zig run "$f" || true
          done
