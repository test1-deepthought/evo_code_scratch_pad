name: NOVA CI

on:
  push:
    branches:
      - 'evo/nova*'
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint dependencies
        run: pip install flake8
      - name: Lint nova/ module
        run: flake8 nova/ --count --max-line-length=120 --statistics || true
      - name: Lint tests/ module
        run: flake8 tests/ --count --max-line-length=120 --statistics || true

  type-check:
    name: Type check with mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install mypy
      - name: Check nova module types
        run: mypy nova/ --ignore-missing-imports --disallow-untyped-defs || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f nova/requirements.txt ]; then pip install -r nova/requirements.txt; fi
      - name: Run NOVA test suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=nova --cov-report=term-missing
      - name: Check test coverage
        run: |
          python -m pytest tests/ --cov=nova --cov-report=term-missing --cov-fail-under=70 || echo "Coverage below 70%"

  syntax-validate:
    name: Validate Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all Python files
        shell: python
        run: |
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk('nova'):
            if '__pycache__' in root:
              continue
            for f in files:
              if f.endswith('.py'):
                path = os.path.join(root, f)
                try:
                  with open(path) as fh:
                    ast.parse(fh.read(), filename=path)
                  print(f'OK: {path}')
                except SyntaxError as e:
                  errors.append(f'SYNTAX_ERROR in {path}: {e}')
                  print(f'FAIL: {path}: {e}')
          for root, dirs, files in os.walk('tests'):
            if '__pycache__' in root:
              continue
            for f in files:
              if f.endswith('.py'):
                path = os.path.join(root, f)
                try:
                  with open(path) as fh:
                    ast.parse(fh.read(), filename=path)
                  print(f'OK: {path}')
                except SyntaxError as e:
                  errors.append(f'SYNTAX_ERROR in {path}: {e}')
                  print(f'FAIL: {path}: {e}')
          if errors:
            sys.exit(1)

  import-check:
    name: Verify imports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify standalone imports
        shell: python
        run: |
          import sys, os
          sys.path.insert(0, '.')
          modules = [
            'nova.config',
            'nova.evidence_dimensions',
            'nova.graceful_degradation',
            'nova.confidence_calibrator',
            'nova.verification_scheduler',
            'nova.knowledge_graph',
            'nova.meta_cognitive_loop',
            'nova.proof_library',
            'nova.agent',
          ]
          errors = []
          for mod_name in modules:
            try:
              __import__(mod_name)
              print(f'OK: {mod_name}')
            except ImportError as e:
              errors.append(f'IMPORT_ERROR: {mod_name}: {e}')
              print(f'FAIL: {mod_name}: {e}')
          if errors:
            sys.exit(1)

  all-checks-pass:
    name: All checks passed
    if: always()
    needs: [lint, type-check, test, syntax-validate, import-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          echo "Checking all job results..."
          echo "lint: ${{ needs.lint.result }}"
          echo "type-check: ${{ needs.type-check.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "syntax-validate: ${{ needs.syntax-validate.result }}"
          echo "import-check: ${{ needs.import-check.result }}"
          failures=0
          for job in lint type-check test syntax-validate import-check; do
            result=$(echo "${{ toJSON(needs) }}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('$job',{}).get('result','skipped'))")
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "FAILED: $failures job(s) did not pass"
            exit 1
          fi
          echo "All checks passed! ✅"
