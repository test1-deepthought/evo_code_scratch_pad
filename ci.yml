name: Test PR #1 - SharedKB Protocol
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests with proper Python path
        run: |
          pip install pytest
          python -m pytest tests/test_shared_kb.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}
